<!DOCTYPE html>
<!--
  PÁGINA: Login/Cadastro (/login/)
  O QUE É: porta de entrada única de autenticação — email/senha e Google.
  Depois de logar, redireciona pro simulador (/simulador-vwap.html).
  Se a pessoa já estiver logada ao abrir essa página, redireciona direto.
  DEPENDE DE: Supabase (mesmo projeto do simulador — credenciais abaixo).
-->
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Entrar — TapeDrill</title>
<meta name="description" content="Entre ou crie sua conta pra treinar no TapeDrill.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400;1,500;1,600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<style>
:root{
  --ink:#090B10; --panel:#10141C; --text:#EDEFF4; --muted:#8B93A6; --faint:#4E5668;
  --gold:#D9A441; --sell:#F2495C; --line:#212837;
  --font-display:'EB Garamond', Georgia, serif; --font-ui:'EB Garamond', Georgia, serif;
  --font-mono:'IBM Plex Mono',monospace;
}
*{box-sizing:border-box; margin:0; padding:0}
body{background:var(--ink); color:var(--text); font-family:var(--font-ui); overflow-x:hidden}
a{color:inherit}

#authGate{
  position:relative; min-height:100vh; display:flex; align-items:center; justify-content:center;
  padding:32px 20px; overflow:hidden; background:#050608;
  background-image:
    radial-gradient(1100px 620px at 82% -10%, #14161c 0%, transparent 60%),
    radial-gradient(900px 560px at -10% 108%, #101216 0%, transparent 55%);
}
#gateCanvas{position:absolute; inset:0; width:100%; height:100%; display:block; touch-action:none}
.gate-content{
  position:relative; z-index:2; width:100%; max-width:360px;
  animation:gateIn .7s cubic-bezier(.16,1,.3,1) both;
}
@keyframes gateIn{from{opacity:0; transform:translateY(10px)} to{opacity:1; transform:translateY(0)}}
.gate-brand{
  display:flex; align-items:center; gap:8px; font-weight:700;
  font-size:15px; color:var(--muted); margin-bottom:28px; letter-spacing:.2px; text-decoration:none;
}
.gate-brand .dot{width:7px;height:7px;border-radius:50%;background:var(--gold);box-shadow:0 0 8px var(--gold)}
.gate-content h1{font-size:27px;font-weight:700;margin-bottom:10px;letter-spacing:-.3px}
.gate-content p{font-size:14.5px;font-style:italic;color:var(--muted);line-height:1.55;margin-bottom:26px}
.frow.full{margin-bottom:14px}
.flabel{display:block; font-size:12.5px; color:var(--muted); margin-bottom:6px}
input{
  width:100%; background:#12151b; border:1px solid var(--line); color:var(--text);
  padding:11px 13px; border-radius:8px; font-family:var(--font-ui); font-size:14.5px;
}
input:focus{outline:none; border-color:var(--gold)}
.btn{
  font-family:var(--font-ui); font-weight:700; font-size:14px; letter-spacing:.4px; text-transform:uppercase;
  padding:13px 24px; border-radius:9px; text-decoration:none; display:inline-flex; align-items:center;
  justify-content:center; gap:8px; border:0; cursor:pointer; transition:transform .15s;
}
.btn:hover{transform:translateY(-1px)}
.btn.primary{background:var(--gold); color:#1A1405; width:100%; margin-bottom:10px}
.btn.primary:disabled{opacity:.4; cursor:not-allowed; transform:none !important}
.btn.ghost{background:transparent; border:1px solid var(--line); color:var(--text); width:100%}
#authMsg{font-size:12px;color:var(--faint);margin-top:14px;line-height:1.5;min-height:14px}
#authMsg.err{color:var(--sell)}
.oauth-btn{
  width:100%; display:flex; align-items:center; justify-content:center; gap:10px;
  background:#14161c; border:1px solid #262a33; color:var(--text); font-family:var(--font-ui);
  font-weight:600; font-size:14px; padding:12px 16px; border-radius:10px; cursor:pointer;
  transition:background .15s, border-color .15s, transform .15s;
}
.oauth-btn:hover{background:#1A1D24; border-color:#33394A; transform:translateY(-1px)}
.oauth-divider{display:flex; align-items:center; gap:12px; margin:18px 0; color:var(--faint); font-size:12px}
.oauth-divider::before, .oauth-divider::after{content:''; flex:1; height:1px; background:#20232B}
.backhome{position:relative; z-index:2; position:fixed; top:20px; left:24px; font-size:13px; color:var(--faint); text-decoration:none}
</style>
</head>
<body>

<a href="/" class="backhome">← tapedrill.com</a>

<div id="authGate">
  <canvas id="gateCanvas"></canvas>
  <div class="gate-content">
    <a href="/" class="gate-brand"><span class="dot"></span>TapeDrill</a>
    <h1 id="authGateTitle">Entre pra treinar</h1>
    <p>Cada pessoa tem o próprio diário e progresso, salvos com segurança na nuvem.</p>

    <button class="oauth-btn" id="btnGoogle" type="button">
      <svg width="18" height="18" viewBox="0 0 18 18"><path fill="#4285F4" d="M17.64 9.2c0-.64-.06-1.25-.16-1.84H9v3.48h4.84a4.14 4.14 0 0 1-1.8 2.72v2.26h2.9c1.7-1.56 2.7-3.86 2.7-6.62z"/><path fill="#34A853" d="M9 18c2.43 0 4.47-.8 5.96-2.18l-2.9-2.26c-.8.54-1.84.86-3.06.86-2.35 0-4.34-1.59-5.05-3.72H.9v2.33A9 9 0 0 0 9 18z"/><path fill="#FBBC05" d="M3.95 10.7A5.4 5.4 0 0 1 3.66 9c0-.59.1-1.16.29-1.7V4.96H.9A9 9 0 0 0 0 9c0 1.45.35 2.83.9 4.04l3.05-2.34z"/><path fill="#EA4335" d="M9 3.58c1.32 0 2.51.45 3.44 1.35l2.58-2.58C13.46.89 11.43 0 9 0A9 9 0 0 0 .9 4.96l3.05 2.34C4.66 5.17 6.65 3.58 9 3.58z"/></svg>
      Entrar com Google
    </button>
    <div class="oauth-divider"><span>ou</span></div>

    <div class="frow full"><span class="flabel">Email</span><input type="email" id="authEmail" placeholder="voce@email.com"></div>
    <div class="frow full">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px">
        <span class="flabel" style="margin-bottom:0">Senha</span>
        <a href="#" id="btnEsqueci" style="font-size:12px;color:var(--faint);text-decoration:underline">Esqueci minha senha</a>
      </div>
      <input type="password" id="authPass" placeholder="mínimo 6 caracteres">
    </div>
    <button class="btn primary" id="btnEntrar" disabled>Entrar</button>
    <button class="btn ghost" id="btnCriarConta">Criar conta</button>
    <div id="authMsg"></div>
  </div>
</div>

<script>
"use strict";
const $ = s => document.querySelector(s);

/* ============ Supabase ============ */
const SUPABASE_URL = 'https://atmmupzdcjtyncvnxlie.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImF0bW11cHpkY2p0eW5jdm54bGllIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODY2MzY4ODUsImV4cCI6MjEwMjIxMjg4NX0.LC4WpfayOqOfVb6v9RSOeJIj2Za1_NOyG7P3sUd-3a8';
const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

const NEXT_URL = new URL('../simulador-vwap.html', window.location.href).href;

function setAuthMsg(msg,isErr){
  const el=$('#authMsg'); if(!el)return;
  el.textContent=msg||''; el.classList.toggle('err',!!isErr);
}
function withTimeout(promise, ms, msg){
  return Promise.race([
    promise,
    new Promise((_,reject)=>setTimeout(()=>reject(new Error(msg||'Tempo esgotado')),ms))
  ]);
}

async function cloudSignUp(){
  const email=$('#authEmail').value.trim(), pass=$('#authPass').value;
  if(!email||pass.length<6) return setAuthMsg('Preencha email e uma senha com 6+ caracteres.',true);
  setAuthMsg('Criando conta…');
  try{
    const {error}=await withTimeout(sb.auth.signUp({
      email, password:pass,
      options:{ emailRedirectTo: NEXT_URL }
    }), 12000, 'Conexão com o servidor demorou demais.');
    if(error) return setAuthMsg(error.message,true);
    setAuthMsg('Conta criada! Se pedir confirmação por email, confira sua caixa de entrada — senão, já pode entrar.');
  }catch(err){
    console.error('Falha de conexão no cadastro:',err);
    setAuthMsg('Não consegui conectar ao servidor. Verifique sua internet ou tente desativar bloqueadores de anúncio/rastreamento pra este site. ('+(err.message||'')+')',true);
  }
}
async function cloudSignIn(){
  const email=$('#authEmail').value.trim(), pass=$('#authPass').value;
  if(!email||!pass) return setAuthMsg('Preencha email e senha.',true);
  setAuthMsg('Entrando…');
  try{
    const {error}=await withTimeout(sb.auth.signInWithPassword({email,password:pass}), 12000, 'Conexão com o servidor demorou demais.');
    if(error) return setAuthMsg(error.message,true);
    setAuthMsg('Entrando, um instante…');
    window.location.href = NEXT_URL;
  }catch(err){
    console.error('Falha de conexão no login:',err);
    setAuthMsg('Não consegui conectar ao servidor. Verifique sua internet ou tente desativar bloqueadores de anúncio/rastreamento pra este site. ('+(err.message||'')+')',true);
  }
}
async function cloudSignInGoogle(){
  setAuthMsg('Redirecionando pro Google…');
  try{
    const {error}=await withTimeout(sb.auth.signInWithOAuth({
      provider:'google',
      options:{ redirectTo: NEXT_URL }
    }), 10000, 'O Google não respondeu a tempo.');
    if(error) setAuthMsg(error.message,true);
  }catch(err){
    console.error('Falha no login com Google:',err);
    setAuthMsg('Login com Google ainda não está configurado neste site. Use email e senha por enquanto.',true);
  }
}

$('#btnEntrar').addEventListener('click',cloudSignIn);
$('#btnCriarConta').addEventListener('click',cloudSignUp);
$('#btnGoogle').addEventListener('click',cloudSignInGoogle);

async function cloudResetPassword(){
  const email = $('#authEmail').value.trim();
  if(!email || !email.includes('@')){
    setAuthMsg('Digita seu email no campo acima primeiro, depois clica em "Esqueci minha senha".', true);
    $('#authEmail').focus();
    return;
  }
  setAuthMsg('Enviando email de recuperação…');
  try{
    const resetUrl = new URL('reset.html', window.location.href).href;
    const {error} = await withTimeout(sb.auth.resetPasswordForEmail(email, {
      redirectTo: resetUrl
    }), 12000, 'Conexão com o servidor demorou demais.');
    if(error) return setAuthMsg(error.message, true);
    setAuthMsg('Se esse email tiver uma conta, chegou uma mensagem com o link de redefinição. Confira sua caixa de entrada (e o spam).');
  }catch(err){
    setAuthMsg('Não consegui conectar ao servidor. ('+(err.message||'')+')', true);
  }
}
$('#btnEsqueci').addEventListener('click', e=>{ e.preventDefault(); cloudResetPassword(); });

function updGateBtn(){
  const email=$('#authEmail').value.trim(), pass=$('#authPass').value;
  $('#btnEntrar').disabled = !(email.includes('@') && email.includes('.') && pass.length>=1);
}
$('#authEmail').addEventListener('input',updGateBtn);
$('#authPass').addEventListener('input',updGateBtn);
$('#authPass').addEventListener('keydown',e=>{ if(e.key==='Enter' && !$('#btnEntrar').disabled) cloudSignIn(); });

// se já estiver logado, pula direto pro simulador
(async function checkExisting(){
  try{
    const {data:{session}} = await sb.auth.getSession();
    if(session) window.location.href = NEXT_URL;
  }catch(err){ console.warn('Falha ao checar sessão existente:', err); }
})();

/* ============ cena 3D de fundo ============ */
(function(){
  const canvas = document.getElementById('gateCanvas');
  if(!canvas || typeof THREE==='undefined') return;

  const scene = new THREE.Scene();
  const camera = new THREE.PerspectiveCamera(45, window.innerWidth/window.innerHeight, 0.1, 100);
  camera.position.z = 6.2;

  const renderer = new THREE.WebGLRenderer({canvas, alpha:true, antialias:true});
  renderer.setPixelRatio(Math.min(window.devicePixelRatio,2));
  renderer.setSize(window.innerWidth, window.innerHeight);

  const geo = new THREE.IcosahedronGeometry(2.1, 0);
  const mat = new THREE.MeshStandardMaterial({color:0x0d0f14, metalness:0.85, roughness:0.25, flatShading:true});
  const mesh = new THREE.Mesh(geo, mat);
  scene.add(mesh);

  const edges = new THREE.EdgesGeometry(geo);
  const lineMat = new THREE.LineBasicMaterial({color:0xD9A441, transparent:true, opacity:0.35});
  mesh.add(new THREE.LineSegments(edges, lineMat));

  const key = new THREE.PointLight(0xD9A441, 18, 20); key.position.set(4,3,5); scene.add(key);
  const fill = new THREE.PointLight(0x4DA3FF, 8, 20); fill.position.set(-5,-2,3); scene.add(fill);
  scene.add(new THREE.AmbientLight(0x222222, 1.2));

  let mx=0, my=0, tx=0, ty=0;
  function onMove(e){
    const x = (e.touches ? e.touches[0].clientX : e.clientX)/window.innerWidth*2-1;
    const y = (e.touches ? e.touches[0].clientY : e.clientY)/window.innerHeight*2-1;
    tx = x*0.5; ty = y*0.35;
  }
  window.addEventListener('mousemove', onMove, {passive:true});
  window.addEventListener('touchmove', onMove, {passive:true});
  window.addEventListener('resize', ()=>{
    camera.aspect = window.innerWidth/window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
  });

  const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  let t=0;
  function animate(){
    requestAnimationFrame(animate);
    t += 0.0032;
    if(!reduceMotion){
      mx += (tx-mx)*0.04; my += (ty-my)*0.04;
      mesh.rotation.y = t*0.5 + mx*0.8;
      mesh.rotation.x = t*0.22 + my*0.6;
    }
    renderer.render(scene, camera);
  }
  if(!reduceMotion) animate(); else { mesh.rotation.set(0.4,0.6,0); renderer.render(scene,camera); }
})();
</script>
</body>
</html>
